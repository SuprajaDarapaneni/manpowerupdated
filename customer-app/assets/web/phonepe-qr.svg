<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 780" width="100%" height="100%">
  <defs>
    <style>
      .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="780" fill="#FFFFFF"/>

  <!-- PhonePe Brand Icon & Header -->
  <circle cx="150" cy="95" r="24" fill="#5f259f"/>
  <text x="150" y="103" fill="#FFFFFF" font-size="24" font-weight="900" class="txt">पे</text>
  <text x="235" y="104" fill="#1E1F23" font-size="28" font-weight="900" class="txt">PhonePe</text>

  <!-- Accepted Here Banner -->
  <text x="200" y="155" fill="#4d1d82" font-size="16" font-weight="800" letter-spacing="1.5" class="txt">ACCEPTED HERE</text>

  <!-- Instruction Subtitle -->
  <text x="200" y="195" fill="#333333" font-size="14" font-weight="500" class="txt">Scan &amp; Pay Using PhonePe App</text>

  <!-- QR Code Container Outer Box -->
  <g transform="translate(45, 230)">
    <!-- QR Finder Pattern 1 (Top Left) -->
    <rect x="0" y="0" width="70" height="70" rx="8" fill="#111111"/>
    <rect x="10" y="10" width="50" height="50" rx="4" fill="#FFFFFF"/>
    <rect x="20" y="20" width="30" height="30" rx="2" fill="#111111"/>

    <!-- QR Finder Pattern 2 (Top Right) -->
    <rect x="240" y="0" width="70" height="70" rx="8" fill="#111111"/>
    <rect x="250" y="10" width="50" height="50" rx="4" fill="#FFFFFF"/>
    <rect x="260" y="20" width="30" height="30" rx="2" fill="#111111"/>

    <!-- QR Finder Pattern 3 (Bottom Left) -->
    <rect x="0" y="240" width="70" height="70" rx="8" fill="#111111"/>
    <rect x="10" y="250" width="50" height="50" rx="4" fill="#FFFFFF"/>
    <rect x="20" y="260" width="30" height="30" rx="2" fill="#111111"/>

    <!-- QR Data Matrix Module Blocks -->
    <rect x="85" y="10" width="15" height="15" fill="#111111"/>
    <rect x="115" y="10" width="15" height="15" fill="#111111"/>
    <rect x="145" y="10" width="15" height="15" fill="#111111"/>
    <rect x="175" y="10" width="15" height="15" fill="#111111"/>
    <rect x="205" y="10" width="15" height="15" fill="#111111"/>

    <rect x="85" y="40" width="15" height="15" fill="#111111"/>
    <rect x="145" y="40" width="15" height="15" fill="#111111"/>
    <rect x="205" y="40" width="15" height="15" fill="#111111"/>

    <!-- Left & Right columns -->
    <rect x="10" y="85" width="15" height="15" fill="#111111"/>
    <rect x="40" y="85" width="15" height="15" fill="#111111"/>
    <rect x="70" y="85" width="15" height="15" fill="#111111"/>
    <rect x="100" y="85" width="15" height="15" fill="#111111"/>
    <rect x="130" y="85" width="15" height="15" fill="#111111"/>
    <rect x="160" y="85" width="15" height="15" fill="#111111"/>
    <rect x="190" y="85" width="15" height="15" fill="#111111"/>
    <rect x="220" y="85" width="15" height="15" fill="#111111"/>
    <rect x="250" y="85" width="15" height="15" fill="#111111"/>
    <rect x="285" y="85" width="15" height="15" fill="#111111"/>

    <rect x="85" y="115" width="15" height="15" fill="#111111"/>
    <rect x="210" y="115" width="15" height="15" fill="#111111"/>
    <rect x="240" y="115" width="15" height="15" fill="#111111"/>
    <rect x="285" y="115" width="15" height="15" fill="#111111"/>

    <!-- Mid grid blocks -->
    <rect x="10" y="145" width="15" height="15" fill="#111111"/>
    <rect x="40" y="145" width="15" height="15" fill="#111111"/>
    <rect x="70" y="145" width="15" height="15" fill="#111111"/>
    <rect x="225" y="145" width="15" height="15" fill="#111111"/>
    <rect x="255" y="145" width="15" height="15" fill="#111111"/>
    <rect x="285" y="145" width="15" height="15" fill="#111111"/>

    <rect x="10" y="175" width="15" height="15" fill="#111111"/>
    <rect x="55" y="175" width="15" height="15" fill="#111111"/>
    <rect x="85" y="175" width="15" height="15" fill="#111111"/>
    <rect x="210" y="175" width="15" height="15" fill="#111111"/>
    <rect x="240" y="175" width="15" height="15" fill="#111111"/>
    <rect x="270" y="175" width="15" height="15" fill="#111111"/>

    <rect x="10" y="205" width="15" height="15" fill="#111111"/>
    <rect x="40" y="205" width="15" height="15" fill="#111111"/>
    <rect x="70" y="205" width="15" height="15" fill="#111111"/>
    <rect x="100" y="205" width="15" height="15" fill="#111111"/>
    <rect x="130" y="205" width="15" height="15" fill="#111111"/>
    <rect x="160" y="205" width="15" height="15" fill="#111111"/>
    <rect x="190" y="205" width="15" height="15" fill="#111111"/>
    <rect x="220" y="205" width="15" height="15" fill="#111111"/>
    <rect x="250" y="205" width="15" height="15" fill="#111111"/>
    <rect x="285" y="205" width="15" height="15" fill="#111111"/>

    <!-- Bottom section data blocks -->
    <rect x="85" y="240" width="15" height="15" fill="#111111"/>
    <rect x="115" y="240" width="15" height="15" fill="#111111"/>
    <rect x="145" y="240" width="15" height="15" fill="#111111"/>
    <rect x="175" y="240" width="15" height="15" fill="#111111"/>
    <rect x="205" y="240" width="15" height="15" fill="#111111"/>
    <rect x="235" y="240" width="15" height="15" fill="#111111"/>
    <rect x="265" y="240" width="15" height="15" fill="#111111"/>
    <rect x="285" y="240" width="15" height="15" fill="#111111"/>

    <rect x="85" y="270" width="15" height="15" fill="#111111"/>
    <rect x="135" y="270" width="15" height="15" fill="#111111"/>
    <rect x="165" y="270" width="15" height="15" fill="#111111"/>
    <rect x="195" y="270" width="15" height="15" fill="#111111"/>
    <rect x="225" y="270" width="15" height="15" fill="#111111"/>
    <rect x="255" y="270" width="15" height="15" fill="#111111"/>
    <rect x="285" y="270" width="15" height="15" fill="#111111"/>

    <!-- Center PhonePe Badge -->
    <circle cx="155" cy="155" r="32" fill="#000000"/>
    <circle cx="155" cy="155" r="30" fill="#000000"/>
    <text x="155" y="165" fill="#FFFFFF" font-size="30" font-weight="900" class="txt">पे</text>
  </g>

  <!-- Payee Name matching user image -->
  <text x="200" y="600" fill="#1E1F23" font-size="16" font-weight="800" letter-spacing="1" class="txt">PRAVEEN  .</text>

  <!-- UPI ID badge -->
  <rect x="100" y="620" width="200" height="34" rx="10" fill="#F4F4F6"/>
  <text x="200" y="642" fill="#5f259f" font-size="13" font-weight="800" class="txt">UPI: prnm@kotak</text>

  <!-- Footer Legal Note matching user image -->
  <text x="200" y="725" fill="#444444" font-size="10" font-weight="700" class="txt">© 2026, All rights reserved, PhonePe Ltd (Formerly known</text>
  <text x="200" y="742" fill="#444444" font-size="10" font-weight="700" class="txt">as 'PhonePe Private Ltd')</text>
</svg>
