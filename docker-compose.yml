version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: manpowerlink-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: manpowerlink
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./admin/backend
      dockerfile: Dockerfile
    container_name: manpowerlink-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/manpowerlink
      JWT_ACCESS_SECRET: prod_access_secret_change_me
      JWT_REFRESH_SECRET: prod_refresh_secret_change_me
    depends_on:
      - mongodb

  admin-frontend:
    build:
      context: ./admin/frontend
      dockerfile: Dockerfile
    container_name: manpowerlink-admin
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
